<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Header con Botones Desplazables</title>
    <link rel="stylesheet" href="decks_styles.css">
    <!-- La hoja de estilos externa decks_styles.css ya contiene
         display: flex para .button-container, por lo que el
         style tag de aquí se puede omitir. -->
</head>
<body>

    <header class="scrollable-header">
        <div id="header-buttons" class="button-container">
            <!-- Los botones del header se generan por JS -->
        </div>
    </header>

    <main>
        <section class="grid-container">
          <h2>Galería de botones</h2>
          <div id="grid-buttons" class="grid-buttons">
            <!-- Los botones de la cuadrícula se generan por JS -->
          </div>
        </section>
    </main>

    <script>
      // Configuración: cambia estos valores si quieres más/menos botones
      const HEADER_COUNT = 8;   // botones en el header
      const GRID_COUNT = 60;    // botones en la cuadricula

      // Generar botones del header
      const headerContainer = document.getElementById('header-buttons');
      for (let i = 1; i <= HEADER_COUNT; i++) {
        const btn = document.createElement('button');
        btn.className = 'nav-button';
        btn.textContent = `Botón ${i}`;
        headerContainer.appendChild(btn);
      }

      // Medir el primer botón para que el botón "+" tenga las mismas dimensiones
      const firstButton = headerContainer.querySelector('.nav-button');
      let buttonWidth = 'auto';
      let buttonHeight = 'auto';
      if (firstButton) {
        const styles = window.getComputedStyle(firstButton);
        buttonWidth = styles.width;
        buttonHeight = styles.height;
      }

      // Crear y agregar el botón "+" al final
      const addButton = document.createElement('button');
      addButton.className = 'nav-button';
      addButton.textContent = '+';
      Object.assign(addButton.style, {
        // marginLeft: 'auto', // Quitado para que siga el flujo normal
        width: buttonWidth,
        height: buttonHeight,
        display: 'flex',
        alignItems: 'center',
        justifyContent: 'center',
        fontSize: '1.5rem' // Hacemos el "+" un poco más grande
      });
      headerContainer.appendChild(addButton);

      // Generar botones de la cuadricula
      const gridContainer = document.getElementById('grid-buttons');
      for (let i = 1; i <= GRID_COUNT; i++) {
        const btn = document.createElement('button');
        btn.className = 'grid-button';
        btn.textContent = `Botón ${i}`;
        gridContainer.appendChild(btn);
      }
    </script>

</body>
</html>
